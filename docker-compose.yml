# Production topology — meant to run on the petite-etoile LXC.
#
# asterisk runs with network_mode: host so RTP (10000-20000/udp) and SIP
# (5060/udp) don't need per-port Docker NAT mapping and don't add a second
# NAT layer on top of the LAN/router. webapp and db stay on the regular
# Docker bridge network.
#
# For local development without a real LXC/LAN, docker-compose.override.yml
# (auto-loaded by `docker compose up`) switches asterisk to normal bridge
# networking. To deploy for real, explicitly skip the override:
#   docker compose -f docker-compose.yml up -d
services:
  asterisk:
    build: ./asterisk
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data/asterisk-etc:/etc/asterisk
      - ./data/asterisk-spool:/var/spool/asterisk
      - ./data/asterisk-log:/var/log/asterisk
    environment:
      AMI_USER: ${AMI_USER:-webapp}
      AMI_SECRET: ${AMI_SECRET:?AMI_SECRET is required}
      # asterisk is host-networked; it reaches "db" (bridge network) via the
      # port compose publishes on the host's loopback interface below.
      CDR_DB_HOST: 127.0.0.1
      CDR_DB_PORT: "5432"
      CDR_DB_NAME: ${DB_NAME:-asterisk}
      CDR_DB_USER: ${DB_USER:-asterisk}
      CDR_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      RESEND_SMTP_HOST: ${RESEND_SMTP_HOST:-smtp.resend.com}
      RESEND_SMTP_PORT: ${RESEND_SMTP_PORT:-587}
      RESEND_SMTP_USER: ${RESEND_SMTP_USER:-resend}
      RESEND_SMTP_PASSWORD: ${RESEND_SMTP_PASSWORD:-}
      VOICEMAIL_FROM_EMAIL: ${VOICEMAIL_FROM_EMAIL:-voicemail@localhost}
    depends_on:
      db:
        condition: service_healthy

  webapp:
    build: ./webapp
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Same bind mount as the asterisk container's /etc/asterisk — this is
      # what makes the generate-then-reload pattern work: webapp writes the
      # files, then tells Asterisk (over AMI) to reload them.
      - ./data/asterisk-etc:/etc/asterisk
      - ./data/asterisk-spool:/var/spool/asterisk:ro
      # Narrow read-write exception to the :ro mount above, for the IVR
      # custom-greeting feature's "delete to revert to default" button
      # (webapp needs to remove ivr-prompts/greeting.wav; everything else
      # under the spool — voicemail, recordings — stays read-only from
      # webapp). Same host directory tree as the mount above, just a more
      # specific path — both containers see the exact same files, this
      # isn't a second copy. Docker applies the more specific mount point
      # on top of the broader one; verify with `docker compose exec webapp
      # touch /var/spool/asterisk/ivr-prompts/probe` (should succeed) vs.
      # `touch /var/spool/asterisk/voicemail/probe` (should still fail).
      - ./data/asterisk-spool/ivr-prompts:/var/spool/asterisk/ivr-prompts
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-asterisk}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:-asterisk}
      # webapp stays on the Docker bridge network while asterisk is
      # host-networked — host.docker.internal (below) resolves to the LXC
      # host itself, which is where Asterisk's AMI actually listens.
      AMI_HOST: host.docker.internal
      AMI_PORT: "5038"
      AMI_USER: ${AMI_USER:-webapp}
      AMI_SECRET: ${AMI_SECRET:?AMI_SECRET is required}
      ASTERISK_ETC_DIR: /etc/asterisk
      ASTERISK_SPOOL_DIR: /var/spool/asterisk
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VOICEMAIL_FROM_EMAIL: ${VOICEMAIL_FROM_EMAIL:-voicemail@localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-asterisk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-asterisk}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # Published on loopback only, so the host-networked asterisk container
      # (cdr_pgsql) can reach Postgres via 127.0.0.1 — see CDR_DB_HOST above.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-asterisk} -d ${DB_NAME:-asterisk}"]
      interval: 10s
      timeout: 5s
      retries: 5
