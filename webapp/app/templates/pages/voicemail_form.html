{% extends "pages/base.html" %}
{% block title %}Boîte vocale {{ ext.extension }}{% endblock %}
{% block content %}
<div class="section-header">
  <div class="section-title">Boîte vocale — extension {{ ext.extension }}</div>
</div>

<div class="card" style="max-width:480px">
  {% if error %}<div class="form-error" style="margin-bottom:14px">{{ error }}</div>{% endif %}
  <form method="post" action="/voicemail/{{ ext.extension }}/edit">
    <div class="form-group">
      <label class="form-label">
        <input type="checkbox" name="voicemail_enabled" value="true" style="width:auto"
               {% if (form.voicemail_enabled if form else ext.voicemail_enabled) %}checked{% endif %}>
        Messagerie vocale activée
      </label>
    </div>
    <div class="form-group">
      <label class="form-label" for="voicemail_pin">NIP</label>
      <input type="text" id="voicemail_pin" name="voicemail_pin" value="{{ form.voicemail_pin if form else (ext.voicemail_pin or '') }}">
    </div>
    <div class="form-group">
      <label class="form-label" for="voicemail_email">Courriel de notification</label>
      <input type="email" id="voicemail_email" name="voicemail_email" value="{{ form.voicemail_email if form else (ext.voicemail_email or '') }}">
    </div>
    <div class="form-actions">
      <a href="/voicemail" class="btn btn-secondary">Annuler</a>
      <button type="submit" class="btn btn-primary">Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
