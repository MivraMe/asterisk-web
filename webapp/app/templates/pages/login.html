<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion · Asterisk Manager</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>★ ASTERISK MANAGER</h1>
    {% if error %}
    <div class="form-error" style="margin-bottom:14px">{{ error }}</div>
    {% endif %}
    <form method="post" action="/api/auth/login">
      <input type="hidden" name="next" value="{{ next or '/' }}">
      <div class="form-group">
        <label class="form-label" for="username">Utilisateur</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" style="width:100%">Connexion</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
